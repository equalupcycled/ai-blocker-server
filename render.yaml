services:
  - type: web
    name: ai-blocker-server
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PROMOTE_THRESHOLD
        value: "5"
      - key: ADMIN_TOKEN
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ai-blocker-db
          property: connectionString
      - key: PGSSL
        value: "false"
databases:
  - name: ai-blocker-db
    plan: free
    databaseName: aiblocker
